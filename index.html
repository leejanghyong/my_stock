<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 금융 대시보드 (아코디언 차트형)</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-lg flex flex-col justify-between p-3">
        
        <div>
            <!-- 상단 헤더 -->
            <header class="flex justify-between items-center mb-3">
                <h1 class="text-lg font-bold text-gray-800">📊 실시간 금융 대시보드</h1>
                <span id="network-status" class="text-[11px] text-emerald-600 bg-emerald-50 font-semibold px-2 py-0.5 rounded">시스템 가동</span>
            </header>

            <!-- 💵 원/달러 환율 영역 -->
            <div class="bg-blue-50 border border-blue-200 rounded-xl mb-3 overflow-hidden shadow-sm">
                <!-- 환율 상단 정보 영역 (클릭 시 하단 차트 토글) -->
                <div onclick="toggleChart('USD')" class="p-2.5 flex flex-col cursor-pointer hover:bg-blue-100/50 active:scale-[0.99] transition-all duration-150">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-semibold text-blue-800">💵 원/달러 환율 (USD/KRW)</span>
                        <span id="usd-krw" class="text-base font-bold text-blue-900">0.00 원</span>
                    </div>
                    <div id="time-USD" class="text-[9px] text-blue-400 text-right mt-0.5">데이터 대기 중...</div>
                </div>
                
                <!-- 📉 환율 차트 삽입부 -->
                <div id="chart-area-USD" class="hidden bg-white border-t border-blue-200 p-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-blue-800">📈 원/달러 환율 추이</span>
                        <select onchange="changePeriod(this.value)" class="period-select text-[10px] bg-gray-50 border border-gray-300 rounded px-1.5 py-0.5 font-semibold text-gray-600">
                            <option value="7d">7일</option>
                            <option value="14d">14일</option>
                            <option value="30d" selected>30일</option>
                            <option value="60d">60일</option>
                            <option value="90d">90일</option>
                            <option value="1y">1년</option>
                            <option value="3y">3년</option>
                            <option value="5y">5년</option>
                        </select>
                    </div>
                    <div class="relative w-full h-36">
                        <canvas id="chart-canvas-USD" class="w-full h-full"></canvas>
                    </div>
                </div>
            </div>

            <!-- 📈 주식 시세 리스트 (각 주식 카드 하단에 개별 차트 영역이 포함됩니다) -->
            <div class="space-y-2 mb-4" id="stock-list">
                <!-- 초기에 빈 틀 구성 -->
            </div>
        </div>

        <!-- 하단 정보 -->
        <footer class="mt-4 pt-3 border-t border-gray-100 text-center text-[11px] text-gray-400">
            <p>💡 주식 및 환율 카드를 누르면 아래로 그래프가 펼쳐집니다.</p>
            <p class="mt-0.5">화면 갱신 시각: <span id="update-time">-</span></p>
        </footer>

    </div>

    <script>
        const tickers = {
            'SKHY': 'SK하이닉스 (US)',
            'QLD': '나스닥 100 X2',
            'TQQQ': '나스닥 100 X3',
            'SOXL': '반도체 X3',
            'QQQ': '나스닥 100 지수',
            'SPY': 'S&P 500 지수'
        };

        let trendChart = null; // 활성화된 단 하나의 Chart 객체 저장용
        let globalChartData = {}; 
        let selectedTicker = 'QQQ'; // 기본적으로 켜질 종목
        let selectedRange = '30d'; // 기본 조회 기간 30일

        // 각 종목 하단에 그래프 뼈대를 미리 심어 두고 렌더링하는 함수
        function initRender() {
            let initialHTML = '';
            for (const [ticker, name] of Object.entries(tickers)) {
                initialHTML += `
                    <div class="bg-gray-50 border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                        <!-- 클릭 영역 -->
                        <div onclick="toggleChart('${ticker}')" class="p-2.5 flex justify-between items-center cursor-pointer hover:bg-gray-100 active:scale-[0.99] transition-all duration-150">
                            <div class="flex-1 w-full">
                                <div class="text-sm font-bold text-gray-800">${ticker} <span class="text-[10px] font-normal text-gray-400">| ${name}</span></div>
                                <div id="range-${ticker}" class="text-[10px] text-gray-400 mt-0.5">데이터 동기화 대기 중...</div>
                            </div>
                            <div class="text-right">
                                <div id="price-${ticker}" class="text-base font-extrabold text-gray-600">$0.00</div>
                                <div id="change-${ticker}" class="text-[11px] font-bold text-gray-400 mt-0.5">- %</div>
                                <div id="time-${ticker}" class="text-[9px] text-gray-400 mt-0.5">-</div>
                            </div>
                        </div>
                        
                        <!-- 📉 숨겨진 개별 차트 영역 -->
                        <div id="chart-area-${ticker}" class="hidden bg-white border-t border-gray-200 p-3">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-gray-700">📈 ${ticker} 추이</span>
                                <select onchange="changePeriod(this.value)" class="period-select text-[10px] bg-gray-50 border border-gray-300 rounded px-1.5 py-0.5 font-semibold text-gray-600">
                                    <option value="7d">7일</option>
                                    <option value="14d">14일</option>
                                    <option value="30d" selected>30일</option>
                                    <option value="60d">60일</option>
                                    <option value="90d">90일</option>
                                    <option value="1y">1년</option>
                                    <option value="3y">3년</option>
                                    <option value="5y">5년</option>
                                </select>
                            </div>
                            <div class="relative w-full h-36">
                                <canvas id="chart-canvas-${ticker}" class="w-full h-full"></canvas>
                            </div>
                        </div>
                    </div>
                `;
            }
            document.getElementById('stock-list').innerHTML = initialHTML;
        }

        async function fetchWithProxy(targetUrl) {
            try {
                const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(targetUrl)}`);
                if (res.ok) return await res.json();
            } catch (e) { console.log("1차 우회 실패, 백업 터널 작동..."); }

            const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`);
            const data = await res.json();
            return JSON.parse(data.contents);
        }

        function formatMarketTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp * 1000);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `(${month}/${day} ${hours}:${minutes})`;
        }

        async function fetchFinancialData(range = '30d') {
            const now = new Date();
            document.getElementById('update-time').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });

            let interval = '1d';
            if (range === '3y' || range === '5y') interval = '1wk';

            // 1. 환율 정보 가져오기
            try {
                const usdTargetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/KRW=X?interval=${interval}&range=${range}`;
                const usdData = await fetchWithProxy(usdTargetUrl);
                
                const usdMeta = usdData.chart.result[0].meta;
                const usdIndicators = usdData.chart.result[0].indicators.quote[0];
                const usdTimestamps = usdData.chart.result[0].timestamp;

                const validUsdCloses = usdIndicators.close.filter(v => v !== null);
                let currentUsd = usdMeta.regularMarketPrice || usdMeta.previousClose;
                let usdChangeRate = 0;

                if (validUsdCloses.length >= 2) {
                    currentUsd = validUsdCloses[validUsdCloses.length - 1];
                    const prevUsd = validUsdCloses[validUsdCloses.length - 2];
                    usdChangeRate = ((currentUsd - prevUsd) / prevUsd) * 100;
                }
                
                const usdIsUp = usdChangeRate >= 0;
                const usdColor = usdIsUp ? 'text-red-500' : 'text-blue-500';
                const usdSign = usdIsUp ? '▲' : '▼';

                document.getElementById('usd-krw').innerHTML = `
                    <span class="text-base font-bold text-blue-900">${currentUsd.toFixed(2)} 원</span>
                    <span class="text-[11px] font-bold ${usdColor} ml-2">${usdSign} ${Math.abs(usdChangeRate).toFixed(2)}%</span>
                `;
                
                const usdTimeStr = formatMarketTime(usdMeta.regularMarketTime);
                document.getElementById('time-USD').innerText = `최종 거래 시각: ${usdTimeStr}`;

                let usdLabels = [];
                let usdPrices = [];
                if (usdTimestamps) {
                    usdTimestamps.forEach((ts, idx) => {
                        const date = new Date(ts * 1000);
                        const label = (range === '3y' || range === '5y' || range === '1y') 
                            ? `${String(date.getFullYear()).slice(-2)}/${date.getMonth()+1}`
                            : `${date.getMonth()+1}/${date.getDate()}`;
                            
                        if (idx === 0 || usdLabels[usdLabels.length - 1] !== label) {
                            if (usdIndicators.close[idx] !== null) {
                                usdLabels.push(label);
                                usdPrices.push(usdIndicators.close[idx]);
                            }
                        }
                    });
                }
                globalChartData['USD'] = { labels: usdLabels, prices: usdPrices, isCurrency: true };

            } catch (e) {
                console.error("환율 데이터 수집 실패:", e);
            }

            // 2. 주식 정보 가져오기
            for (const [ticker, name] of Object.entries(tickers)) {
                try {
                    const targetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=${interval}&range=${range}`;
                    const stockData = await fetchWithProxy(targetUrl);
                    
                    const meta = stockData.chart.result[0].meta;
                    const indicators = stockData.chart.result[0].indicators.quote[0];
                    const timestamps = stockData.chart.result[0].timestamp;

                    const validCloses = indicators.close.filter(v => v !== null);
                    
                    let currentPrice = meta.regularMarketPrice || meta.previousClose;
                    let changeRate = 0;

                    if (validCloses.length >= 2) {
                        currentPrice = validCloses[validCloses.length - 1];
                        const lastValidPrevPrice = validCloses[validCloses.length - 2];
                        changeRate = ((currentPrice - lastValidPrevPrice) / lastValidPrevPrice) * 100;
                    } else {
                        const prevPrice = meta.previousClose || 0;
                        changeRate = prevPrice !== 0 ? ((currentPrice - prevPrice) / prevPrice) * 100 : 0;
                    }

                    const highs = indicators.high.filter(v => v !== null);
                    const lows = indicators.low.filter(v => v !== null);
                    const highPrice = highs.length ? Math.max(...highs) : currentPrice;
                    const lowPrice = lows.length ? Math.min(...lows) : currentPrice;

                    const isUp = changeRate >= 0;
                    const colorClass = isUp ? 'text-red-500' : 'text-blue-500';
                    const sign = isUp ? '▲' : '▼';

                    document.getElementById(`price-${ticker}`).innerText = `$${currentPrice.toFixed(2)}`;
                    document.getElementById(`change-${ticker}`).innerText = `${sign} ${Math.abs(changeRate).toFixed(2)}%`;
                    document.getElementById(`change-${ticker}`).className = `text-[11px] font-bold ${colorClass} mt-0.5`;
                    document.getElementById(`range-${ticker}`).innerText = `고: $${highPrice.toFixed(2)} / 저: $${lowPrice.toFixed(2)}`;
                    
                    const stockTimeStr = formatMarketTime(meta.regularMarketTime);
                    document.getElementById(`time-${ticker}`).innerText = stockTimeStr;

                    let labels = [];
                    let prices = [];
                    if (timestamps) {
                        timestamps.forEach((ts, idx) => {
                            const date = new Date(ts * 1000);
                            const label = (range === '3y' || range === '5y' || range === '1y') 
                                ? `${String(date.getFullYear()).slice(-2)}/${date.getMonth()+1}`
                                : `${date.getMonth()+1}/${date.getDate()}`;

                            if (idx === 0 || labels[labels.length - 1] !== label) {
                                if (indicators.close[idx] !== null) {
                                    labels.push(label);
                                    prices.push(indicators.close[idx]);
                                }
                            }
                        });
                    }
                    globalChartData[ticker] = { labels, prices, isCurrency: false };

                } catch (error) {
                    console.error(`${ticker} 통신 실패:`, error);
                }
            }

            // 첫 갱신 시 혹은 데이터 업데이트 시 현재 활성화되어 있는 차트를 다시 그려줍니다.
            if (globalChartData[selectedTicker]) {
                const area = document.getElementById(`chart-area-${selectedTicker}`);
                if (area && !area.classList.contains('hidden')) {
                    drawChart(selectedTicker, globalChartData[selectedTicker].labels, globalChartData[selectedTicker].prices);
                }
            }
        }

        // 💡 핵심 기능: 클릭한 종목 바로 아래의 차트 영역을 열고 닫는 함수
        function toggleChart(ticker) {
            const allTickers = ['USD', ...Object.keys(tickers)];
            
            allTickers.forEach(t => {
                const area = document.getElementById(`chart-area-${t}`);
                if (t === ticker) {
                    // 현재 선택한 종목의 토글 처리
                    if (area.classList.contains('hidden')) {
                        area.classList.remove('hidden');
                        selectedTicker = ticker;
                        // 열린 종목에 맞춰 셀렉트 박스의 값도 싱크를 맞춰줍니다.
                        const selectEl = area.querySelector('.period-select');
                        if (selectEl) selectEl.value = selectedRange;
                        
                        // 차트 렌더링
                        if (globalChartData[ticker]) {
                            drawChart(ticker, globalChartData[ticker].labels, globalChartData[ticker].prices);
                        }
                    } else {
                        area.classList.add('hidden');
                    }
                } else {
                    // 선택하지 않은 다른 모든 차트 영역은 깔끔하게 닫기
                    area.classList.add('hidden');
                }
            });
        }

        // 💡 핵심 기능: 새로 바뀐 종목의 개별 캔버스에 맞춤형 라인 차트를 그리는 함수
        function drawChart(ticker, labels, data) {
            const ctx = document.getElementById(`chart-canvas-${ticker}`).getContext('2d');
            if (trendChart) {
                trendChart.destroy();
            }

            const isCurrency = globalChartData[ticker]?.isCurrency;
            let labelText = `${ticker} 종가 ($)`;
            if (isCurrency) labelText = "환율 (원)";

            const lineColor = isCurrency ? '#3b82f6' : '#10b981'; 
            const fillColor = isCurrency ? 'rgba(59, 130, 246, 0.05)' : 'rgba(16, 185, 129, 0.05)';
            const pointRadius = (selectedRange === '3y' || selectedRange === '5y') ? 0 : 1.5;

            trendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelText,
                        data: data,
                        borderColor: lineColor,
                        backgroundColor: fillColor,
                        borderWidth: 2,
                        tension: 0.08, 
                        pointRadius: pointRadius,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { 
                        y: { beginAtZero: false },
                        x: {
                            ticks: {
                                maxTicksLimit: 8
                            }
                        }
                    }
                }
            });
        }

        async function changePeriod(range) {
            selectedRange = range; 
            document.getElementById('network-status').innerText = "기간 갱신 중";
            document.getElementById('network-status').className = "text-[11px] text-amber-600 bg-amber-50 font-semibold px-2 py-0.5 rounded";
            await fetchFinancialData(selectedRange);
            document.getElementById('network-status').innerText = "시스템 가동";
            document.getElementById('network-status').className = "text-[11px] text-emerald-600 bg-emerald-50 font-semibold px-2 py-0.5 rounded";
        }

        initRender();
        // 초기 로드 시 30일 값으로 불러옵니다.
        fetchFinancialData(selectedRange).then(() => {
            // 기본 선택된 QQQ의 차트를 맨 처음에 열어두어 생동감을 유지합니다.
            toggleChart('QQQ');
        });

        setInterval(() => { fetchFinancialData(selectedRange); }, 60000);
    </script>
</body>
</html>
