<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실시간 금융 대시보드 (복구 완료 버전)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center">

    <div class="w-full max-w-md bg-white min-h-screen shadow-lg flex flex-col justify-between p-3">
        
        <div>
            <!-- 상단 헤더 -->
            <header class="flex justify-between items-center mb-3">
                <h1 class="text-lg font-bold text-gray-800">📊 실시간 금융 대시보드</h1>
                <span id="network-status" class="text-[11px] text-emerald-600 bg-emerald-50 font-semibold px-2 py-0.5 rounded">시스템 가동</span>
            </header>

            <!-- 💵 원/달러 환율 영역 -->
            <div class="bg-blue-50 border border-blue-200 rounded-xl mb-3 overflow-hidden shadow-sm">
                <div onclick="toggleChart('USD')" class="p-2.5 flex flex-col cursor-pointer hover:bg-blue-100/50 active:scale-[0.99] transition-all duration-150">
                    <div class="flex justify-between items-center">
                        <span class="text-sm font-semibold text-blue-800">💵 원/달러 환율 (USD/KRW)</span>
                        <span id="usd-krw" class="text-base font-bold text-blue-900">조회 중...</span>
                    </div>
                    <div id="time-USD" class="text-[9px] text-blue-400 text-right mt-0.5">데이터 동기화 중...</div>
                </div>
                
                <!-- 📉 환율 차트 삽입부 -->
                <div id="chart-area-USD" class="hidden bg-white border-t border-blue-200 p-3">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-xs font-bold text-blue-800">📈 원/달러 환율 추이</span>
                        <select onchange="changePeriod(this.value, this)" class="period-select text-[10px] bg-gray-50 border border-gray-300 rounded px-1.5 py-0.5 font-semibold text-gray-600 focus:outline-none">
                            <option value="7d">7일</option>
                            <option value="14d">14일</option>
                            <option value="30d" selected>30일</option>
                            <option value="60d">60일</option>
                            <option value="90d">90일</option>
                            <option value="1y">1년</option>
                            <option value="3y">3년</option>
                            <option value="5y">5년</option>
                        </select>
                    </div>
                    <div class="relative w-full h-36">
                        <canvas id="chart-canvas-USD" class="w-full h-full"></canvas>
                    </div>
                </div>
            </div>

            <!-- 📈 주식 시세 리스트 -->
            <div class="space-y-2 mb-4" id="stock-list">
                <!-- 초기에 빈 틀 구성 -->
            </div>
        </div>

        <!-- 하단 정보 -->
        <footer class="mt-4 pt-3 border-t border-gray-100 text-center text-[11px] text-gray-400">
            <p>💡 기간을 누르면 그래프가 즉시 새로 그려집니다.</p>
            <p class="mt-0.5">화면 갱신 시각: <span id="update-time">-</span></p>
        </footer>

    </div>

    <script>
        const tickers = {
            'SKHY': 'SK하이닉스 (US)',
            'QLD': '나스닥 100 X2',
            'TQQQ': '나스닥 100 X3',
            'SOXL': '반도체 X3',
            'QQQ': '나스닥 100 지수',
            'SPY': 'S&P 500 지수'
        };

        let trendChart = null; 
        let globalChartData = {}; 
        let selectedTicker = 'QQQ'; 
        let selectedRange = '30d'; 

        function initRender() {
            let initialHTML = '';
            for (const [ticker, name] of Object.entries(tickers)) {
                initialHTML += `
                    <div class="bg-gray-50 border border-gray-200 rounded-xl overflow-hidden shadow-sm">
                        <div onclick="toggleChart('${ticker}')" class="p-2.5 flex justify-between items-center cursor-pointer hover:bg-gray-100 active:scale-[0.99] transition-all duration-150">
                            <div class="flex-1 w-full">
                                <div class="text-sm font-bold text-gray-800">${ticker} <span class="text-[10px] font-normal text-gray-400">| ${name}</span></div>
                                <div id="range-${ticker}" class="text-[10px] text-gray-400 mt-0.5">데이터 연결 중...</div>
                            </div>
                            <div class="text-right">
                                <div id="price-${ticker}" class="text-base font-extrabold text-gray-600">$0.00</div>
                                <div id="change-${ticker}" class="text-[11px] font-bold text-gray-400 mt-0.5">- %</div>
                                <div id="time-${ticker}" class="text-[9px] text-gray-400 mt-0.5">-</div>
                            </div>
                        </div>
                        
                        <!-- 📉 숨겨진 개별 차트 영역 -->
                        <div id="chart-area-${ticker}" class="hidden bg-white border-t border-gray-200 p-3">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-xs font-bold text-gray-700">📈 ${ticker} 추이</span>
                                <select onchange="changePeriod(this.value, this)" class="period-select text-[10px] bg-gray-50 border border-gray-300 rounded px-1.5 py-0.5 font-semibold text-gray-600 focus:outline-none">
                                    <option value="7d">7일</option>
                                    <option value="14d">14일</option>
                                    <option value="30d" selected>30일</option>
                                    <option value="60d">60일</option>
                                    <option value="90d">90일</option>
                                    <option value="1y">1년</option>
                                    <option value="3y">3년</option>
                                    <option value="5y">5년</option>
                                </select>
                            </div>
                            <div class="relative w-full h-36">
                                <canvas id="chart-canvas-${ticker}" class="w-full h-full"></canvas>
                            </div>
                        </div>
                    </div>
                `;
            }
            document.getElementById('stock-list').innerHTML = initialHTML;
        }

        // 다중 우회 프록시 파이프라인 (안정성 강화)
        async function fetchWithProxy(targetUrl) {
            const proxies = [
                url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
                url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
            ];

            for (const proxyFn of proxies) {
                try {
                    const proxyUrl = proxyFn(targetUrl);
                    const res = await fetch(proxyUrl);
                    if (!res.ok) continue;

                    if (proxyUrl.includes('allorigins')) {
                        const data = await res.json();
                        if (data && data.contents) {
                            return JSON.parse(data.contents);
                        }
                    } else {
                        return await res.json();
                    }
                } catch (e) {
                    // 차선책 프록시 시도
                    continue;
                }
            }
            throw new Error("모든 우회 서버 응답 실패");
        }

        function formatMarketTime(timestamp) {
            if (!timestamp) return '-';
            const date = new Date(timestamp * 1000);
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `(${month}/${day} ${hours}:${minutes})`;
        }

        async function fetchFinancialData(range = '30d') {
            const now = new Date();
            document.getElementById('update-time').innerText = now.toLocaleTimeString('ko-KR', { hour12: false });

            let interval = '1d';
            if (range === '3y' || range === '5y') interval = '1wk';

            // 1. 환율 정보 가져오기
            try {
                const usdTargetUrl = `https://query1.finance.yahoo.com/v8/finance/chart/KRW=X?interval=${interval}&range=${range}`;
                const usdData = await fetchWithProxy(usdTargetUrl);
                
                const usdMeta = usdData.chart.result[0].meta;
                const usdIndicators = usdData.chart.result[0].indicators.quote[0];
                const usdTimestamps = usdData.chart.result[0].timestamp;

                const validUsdCloses = usdIndicators.close.filter(v => v !== null && v !== undefined);
                let currentUsd = usdMeta.regularMarketPrice || usdMeta.previousClose;
                let usdChangeRate = 0;

                if (validUsdCloses.length >= 2) {
                    currentUsd = validUsdCloses[validUsdCloses.length - 1];
                    const prevUsd = validUsdCloses[validUsdCloses.length - 2];
                    usdChangeRate = ((currentUsd - prevUsd) / prevUsd) * 100;
                }
                
                const usdIsUp = usdChangeRate >= 0;
                const usdColor = usdIsUp ? 'text-red-500' : 'text-blue-500';
                const usdSign = usdIsUp ? '▲' : '▼';

                document.getElementById('usd-krw').innerHTML = `
                    <span class="text-base font-
